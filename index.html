<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#b5482f" />
    <meta name="description" content="Карточка персонажа для самодельной настольной ролевой системы" />
    <title>Карточка персонажа НРИ</title>
    <script>
      // Тема применяется до отрисовки, чтобы страница не мигала светлым при тёмной теме.
      try {
        var t = localStorage.getItem('trpg-theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
